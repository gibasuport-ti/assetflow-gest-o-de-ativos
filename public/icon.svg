<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="108" fill="none" stroke="#334155" stroke-width="4" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyanGrad)" stroke-width="6" opacity="0.4" stroke-dasharray="16 12" />

  <!-- Central AssetFlow Shield -->
  <g filter="url(#shadow)">
    <path d="M256 90 L380 150 V270 C380 350 256 420 256 420 C256 420 132 350 132 270 V150 Z" 
          fill="#1e293b" stroke="url(#cyanGrad)" stroke-width="12" stroke-linejoin="round" />
  </g>

  <!-- Laptop Symbol inside Shield -->
  <rect x="196" y="195" width="120" height="76" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="8" />
  <!-- Screen Line -->
  <line x1="216" y1="233" x2="296" y2="233" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <!-- Laptop Base -->
  <path d="M176 283 L336 283 L324 295 L188 295 Z" fill="#94a3b8" />

  <!-- Verification Checkmark / Flow Arrow -->
  <circle cx="330" cy="315" r="42" fill="url(#emeraldGrad)" />
  <path d="M316 315 L326 325 L346 305" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Decorative Orbit Dots -->
  <circle cx="155" cy="180" r="8" fill="#38bdf8" />
  <circle cx="360" cy="180" r="8" fill="#38bdf8" />
  <circle cx="256" cy="435" r="8" fill="#34d399" />
</svg>
